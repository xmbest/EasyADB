name: Cross-Platform CI

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-command: './gradlew.bat packageReleaseMsi'
            artifact-path: 'build/compose/binaries/main-release/msi/**'
            artifact-name: 'windows-msi'

          - os: macos-latest
            build-command: './gradlew packageReleaseDmg'
            artifact-path: 'build/compose/binaries/main-release/dmg/**'
            artifact-name: 'macos-dmg'

          - os: ubuntu-latest
            build-command: './gradlew packageReleaseDeb'
            artifact-path: 'build/compose/binaries/main-release/deb/**'
            artifact-name: 'linux-deb'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JBRSDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21.0.10'
          java-package: 'jdk'
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify JBRSDK toolchain
        run: |
          java -version
          jpackage --version
          jlink --version

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Build application
        run: ${{ matrix.build-command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error